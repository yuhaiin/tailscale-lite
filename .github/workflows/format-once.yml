name: One-time format Tailnet client

on:
  push:
    branches:
      - feat/initial-tailnet-client
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt and tidy
        run: |
          set -euo pipefail
          export GOFLAGS='-tags=ts_omit_netstack,ts_omit_gro'
          gofmt -w ./*.go
          go mod tidy
          git add ./*.go go.mod go.sum
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: gofmt Tailnet client sources and tidy modules'
          git push origin HEAD:feat/initial-tailnet-client
