name: One-time Go formatting and sum synchronization

on:
  push:
    branches:
      - feat/initial-tailnet-client

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format and persist module checksums
        run: |
          set -euo pipefail
          export GOFLAGS='-tags=ts_omit_netstack,ts_omit_gro'
          go mod tidy
          gofmt -w ./*.go
          git add go.mod go.sum ./*.go
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: gofmt and pin dependency sums'
          git push origin HEAD:feat/initial-tailnet-client
