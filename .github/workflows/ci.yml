name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve module dependencies
        run: |
          export GOFLAGS='-tags=ts_omit_netstack,ts_omit_gro'
          go mod tidy
      - name: Verify dependency boundary (no gVisor, tsnet, ipnlocal)
        run: |
          set -euo pipefail
          export GOFLAGS='-tags=ts_omit_netstack,ts_omit_gro'
          go list -deps ./... > /tmp/deps
          if grep -E '^(gvisor.dev/gvisor|tailscale.com/tsnet|tailscale.com/ipn/ipnlocal)(/|$)' /tmp/deps; then
            echo 'Forbidden dependency included in tailscale-lite'
            exit 1
          fi
      - name: Check gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l ./*.go)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Test with race detector
        run: |
          export GOFLAGS='-tags=ts_omit_netstack,ts_omit_gro'
          go test -race -count=1 ./...
      - name: Validate fork Underlay fallback without routes
        run: |
          export GOFLAGS='-tags=ts_omit_netstack,ts_omit_gro'
          go test -race -count=2 -run TestUserDialWithoutRoutesHonorsExplicitUnderlay tailscale.com/net/tsdial
      - name: Validate initial endpoint update synchronization
        env:
          GOFLAGS: '-tags=ts_omit_netstack,ts_omit_gro'
        run: go test -race -count=20 -run '^TestAwaitEndpointUpdates$' tailscale.com/wgengine/magicsock
      - name: Local control/DERP integration
        run: |
          export GOFLAGS='-tags=ts_omit_netstack,ts_omit_gro,integration'
          go test -run 'Test(LocalControlRegistration|KeyExpiry)' -timeout=90s ./...
      - name: Cross compile library
        run: |
          export GOFLAGS='-tags=ts_omit_netstack,ts_omit_gro'
          for target in linux/amd64 darwin/arm64 windows/amd64 android/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./...
          done

  windows-state:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Test identity persistence and migration on Windows
        env:
          GOFLAGS: '-tags=ts_omit_netstack,ts_omit_gro'
          CGO_ENABLED: '0'
        run: go test -count=1 -timeout=120s ./...
