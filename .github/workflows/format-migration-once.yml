name: One-shot legacy state migration formatting
on:
  push:
    branches: [feat/initial-tailnet-client]
    paths: [.github/workflows/format-migration-once.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Format migration files
        run: |
          set -euo pipefail
          gofmt -w migration.go migration_test.go
          git add migration.go migration_test.go
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: gofmt legacy Tailnet migration'
          git push origin HEAD:feat/initial-tailnet-client
