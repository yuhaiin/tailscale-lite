name: Sync upstream module sums (temporary)

on:
  push:
    branches:
      - refactor/use-upstream-tailscale

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tidy and commit go.mod/go.sum
        run: |
          set -euo pipefail
          export GOFLAGS='-tags=ts_omit_netstack,ts_omit_gro'
          go mod tidy
          git add go.mod go.sum
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: sync official Tailscale module checksums'
          git push origin HEAD:refactor/use-upstream-tailscale
